[project]
name = "docs-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raef Krayem", email = "82458575+RaefKrayem@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "protego>=0.7.0",
    "pydantic>=2.14.4",
]

[project.scripts]
docs-crawler = "docs_crawler:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]


[tool.ruff]
line-length = 100
target-version = "py313"
 
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
 
[tool.mypy]
strict = true
files = ["src", "tests"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
